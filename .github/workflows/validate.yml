name: Validate public candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Locked runtime and browser dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          npm ci --prefix tests/pwa --ignore-scripts
          node tests/pwa/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Scan and test
        run: |
          python tools/check_release.py --verify-manifest
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/pwa/*.test.cjs
          cmake -S tests/host -B build/host
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure
          python tools/build_site.py
      - name: Chromium full PWA and demo (synthetic media and model)
        run: node --test tests/pwa/browser.e2e.cjs tests/pwa/demo.e2e.cjs tests/pwa/accessibility.e2e.cjs
      # Firefox needs a running audio backend even with synthetic microphone media.
      - name: Virtual audio backend for Firefox
        run: |
          sudo apt-get update
          sudo apt-get install --yes pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
      - name: Firefox full PWA and demo (synthetic media and model)
        env:
          ZV_TEST_BROWSER: firefox
        run: node --test tests/pwa/browser.e2e.cjs tests/pwa/demo.e2e.cjs
      - name: WebKit static demo
        env:
          ZV_TEST_BROWSER: webkit
        run: node --test tests/pwa/demo.e2e.cjs
      - name: Container build and Compose validation
        run: |
          docker compose config --quiet
          docker build --tag zenti-public:test .
  # Firmware, real-model, independent security, physical and soak gates are separate.
